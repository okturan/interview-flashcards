name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.0, 24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --engine-strict
      # Blocking gate: production dependencies only. Anything that ships to a
      # user's browser must be free of high advisories, and currently is.
      - if: matrix.node == '22.22.0'
        run: npm audit --omit=dev --audit-level=high

      # Non-blocking: dev/build-time dependencies. Scoped out of the gate above
      # because the build toolchain has high advisories with no forward fix:
      # GHSA-mh99-v99m-4gvg (brace-expansion DoS) reaches us through
      # ejs -> jake -> filelist, pulled in by vite-plugin-pwa -> workbox-build
      # -> @trickfilm400/rollup-plugin-off-main-thread. workbox-build 7.4.1 is
      # the newest release and still depends on a vulnerable version; the only
      # patched off-main-thread build is a 4.0.0 prerelease. `npm audit fix`
      # "resolves" this by downgrading vite-plugin-pwa to 1.2.0, which does not
      # support Vite 8 and breaks the build.
      # These packages run on a CI/developer machine over our own source, never
      # in the browser and never on untrusted input, so a DoS-by-huge-input
      # advisory does not reflect real risk here. Kept visible so the backlog
      # does not go unnoticed. Re-narrow this to a blocking gate once
      # workbox-build ships a fixed dependency.
      - if: matrix.node == '22.22.0'
        continue-on-error: true
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npm run check:deploy-tool
